<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  body{font:13px/1.4 Roboto,Arial,sans-serif; color:#202124; margin:0; padding:12px; background:#fff}
  h3{margin:0 0 2px; font-size:15px}
  .sub{color:#5f6368; font-size:11.5px; margin-bottom:12px}
  label{display:block; font-size:11.5px; color:#5f6368; margin:9px 0 3px}
  input,select,textarea{
    width:100%; box-sizing:border-box; padding:7px 8px; font:13px inherit;
    border:1px solid #dadce0; border-radius:6px; background:#fff; color:#202124;
  }
  textarea{resize:vertical; min-height:48px}
  input:focus,select:focus,textarea:focus{outline:2px solid #1a73e8; outline-offset:-1px}
  .row{display:flex; gap:8px}
  .row > *{flex:1; min-width:0}
  .check{display:flex; align-items:center; gap:6px; margin:7px 0; font-size:12.5px; color:#202124}
  .check input{width:auto; margin:0}
  .hint{color:#80868b; font-size:11px; margin:4px 0 0}
  button.search{
    width:100%; margin:14px 0 4px; padding:14px; border:0; border-radius:8px; cursor:pointer;
    background:#d93025; color:#fff; font-size:15px; font-weight:600;
  }
  button.search:hover{background:#c5221f}
  button.search:disabled{background:#e8a09a; cursor:progress}
  details{border-top:1px solid #e8eaed; margin-top:12px; padding-top:8px}
  summary{cursor:pointer; font-weight:600; font-size:12.5px; outline:none}
  #status{margin-top:10px; font-size:12.5px; padding:9px; border-radius:6px; display:none}
  .ok{background:#e6f4ea; color:#137333}
  .err{background:#fce8e6; color:#c5221f}
  .work{background:#e8f0fe; color:#1967d2}
</style>
</head>
<body>

<h3>Поиск роликов</h3>
<div class="sub">Результаты попадут в ячейки таблицы.</div>

<label for="q">Название ролика</label>
<textarea id="q" placeholder="обзор катера Range Marine"></textarea>
<p class="hint">Несколько запросов — каждый с новой строки.</p>
<div class="check"><input type="checkbox" id="titleOnly" checked><label for="titleOnly" style="margin:0">Совпадение именно в названии</label></div>

<button class="search" id="go" onclick="go()">🔎 Поиск</button>
<div id="status"></div>

<label for="target">Куда писать</label>
<select id="target">
  <option value="append">дописать в текущий лист</option>
  <option value="clear">очистить текущий лист</option>
  <option value="new">создать новый лист</option>
</select>

<details open>
  <summary>Основные фильтры</summary>

  <div class="row">
    <div>
      <label for="order">Сортировка YouTube</label>
      <select id="order">
        <option value="relevance">релевантность</option>
        <option value="date">дата</option>
        <option value="viewCount">просмотры</option>
        <option value="rating">рейтинг</option>
        <option value="title">название</option>
      </select>
    </div>
    <div>
      <label for="max">Сколько найти</label>
      <select id="max">
        <option value="25">25</option>
        <option value="50" selected>50</option>
        <option value="100">100</option>
        <option value="200">200</option>
      </select>
    </div>
  </div>

  <label for="sort">Порядок в таблице</label>
  <select id="sort">
    <option value="api">как выдал YouTube</option>
    <option value="views">по просмотрам</option>
    <option value="likes">по лайкам</option>
    <option value="date">по дате (новые)</option>
    <option value="date-asc">по дате (старые)</option>
    <option value="duration">по длительности</option>
    <option value="engagement">по вовлечённости</option>
  </select>

  <label for="period">Период публикации</label>
  <select id="period" onchange="toggleDates()">
    <option value="">любой</option>
    <option value="1">за 24 часа</option>
    <option value="7">за неделю</option>
    <option value="30">за месяц</option>
    <option value="90">за 3 месяца</option>
    <option value="365">за год</option>
    <option value="custom">свой диапазон</option>
  </select>
  <div class="row" id="dates" style="display:none">
    <div><label for="dateFrom">С</label><input id="dateFrom" type="date"></div>
    <div><label for="dateTo">По</label><input id="dateTo" type="date"></div>
  </div>

  <div class="row">
    <div>
      <label for="duration">Длительность</label>
      <select id="duration">
        <option value="any">любая</option>
        <option value="short">до 4 мин</option>
        <option value="medium">4–20 мин</option>
        <option value="long">от 20 мин</option>
      </select>
    </div>
    <div>
      <label for="definition">Качество</label>
      <select id="definition">
        <option value="any">любое</option>
        <option value="high">HD</option>
        <option value="standard">SD</option>
      </select>
    </div>
  </div>

  <div class="row">
    <div>
      <label for="region">Регион</label>
      <select id="region">
        <option value="">любой</option>
        <option value="RU" selected>Россия</option>
        <option value="US">США</option>
        <option value="GB">Великобритания</option>
        <option value="DE">Германия</option>
        <option value="TR">Турция</option>
        <option value="IT">Италия</option>
      </select>
    </div>
    <div>
      <label for="lang">Язык</label>
      <select id="lang">
        <option value="">любой</option>
        <option value="ru" selected>русский</option>
        <option value="en">английский</option>
        <option value="tr">турецкий</option>
        <option value="de">немецкий</option>
        <option value="it">итальянский</option>
      </select>
    </div>
  </div>
</details>

<details>
  <summary>Точные условия</summary>

  <div class="row">
    <div><label for="viewsMin">Просмотров от</label><input id="viewsMin" type="number" min="0"></div>
    <div><label for="viewsMax">до</label><input id="viewsMax" type="number" min="0"></div>
  </div>
  <div class="row">
    <div><label for="lenMin">Длина от, мин</label><input id="lenMin" type="number" min="0" step="0.5"></div>
    <div><label for="lenMax">до, мин</label><input id="lenMax" type="number" min="0" step="0.5"></div>
  </div>

  <label for="include">Обязательные слова в названии</label>
  <input id="include" type="text" placeholder="через запятую">
  <label for="exclude">Стоп-слова</label>
  <input id="exclude" type="text" placeholder="через запятую">
  <label for="channelName">Канал содержит</label>
  <input id="channelName" type="text">
  <label for="channelId">Только канал (UC…, @handle, ссылка)</label>
  <input id="channelId" type="text">

  <div class="check"><input type="checkbox" id="noShorts"><label for="noShorts" style="margin:0">Исключить Shorts</label></div>
  <div class="check"><input type="checkbox" id="onlyShorts"><label for="onlyShorts" style="margin:0">Только Shorts</label></div>
  <div class="check"><input type="checkbox" id="cc"><label for="cc" style="margin:0">Только с субтитрами</label></div>
  <div class="check"><input type="checkbox" id="creative"><label for="creative" style="margin:0">Только Creative Commons</label></div>
  <div class="check"><input type="checkbox" id="safe"><label for="safe" style="margin:0">Безопасный поиск</label></div>

  <label for="event">Трансляции</label>
  <select id="event">
    <option value="">не важно</option>
    <option value="live">идут сейчас</option>
    <option value="upcoming">запланированные</option>
    <option value="completed">завершённые</option>
  </select>
</details>

<script>
var TEXT = ['q','order','max','sort','period','dateFrom','dateTo','duration','definition','region','lang',
            'viewsMin','viewsMax','lenMin','lenMax','include','exclude','channelName','channelId','event','target'];
var FLAGS = ['titleOnly','noShorts','onlyShorts','cc','creative','safe'];

function el(id){ return document.getElementById(id); }

function toggleDates(){
  el('dates').style.display = el('period').value === 'custom' ? 'flex' : 'none';
}

function collect(){
  var p = {};
  TEXT.forEach(function(k){ p[k] = el(k).value; });
  FLAGS.forEach(function(k){ p[k] = el(k).checked; });
  p.clear = (p.target === 'clear');
  return p;
}

function restore(saved){
  if (!saved) return;
  TEXT.forEach(function(k){ if (saved[k] !== undefined && saved[k] !== null) el(k).value = saved[k]; });
  FLAGS.forEach(function(k){ if (saved[k] !== undefined) el(k).checked = !!saved[k]; });
  toggleDates();
}

function status(text, cls){
  var s = el('status');
  s.textContent = text;
  s.className = cls;
  s.style.display = text ? 'block' : 'none';
}

function go(){
  var params = collect();
  if (!params.q.trim()) { status('Введите запрос.', 'err'); return; }

  el('go').disabled = true;
  status('Ищем на YouTube…', 'work');

  google.script.run
    .withSuccessHandler(function(res){
      el('go').disabled = false;
      status('Записано ' + res.written + ' из ' + res.found + ' найденных — лист «' + res.sheetName + '».', 'ok');
    })
    .withFailureHandler(function(err){
      el('go').disabled = false;
      status(err.message || String(err), 'err');
    })
    .runSearch(params);
}

// «Только Shorts» и «Исключить Shorts» взаимно исключают друг друга
el('noShorts').addEventListener('change', function(){ if (this.checked) el('onlyShorts').checked = false; });
el('onlyShorts').addEventListener('change', function(){ if (this.checked) el('noShorts').checked = false; });

google.script.run.withSuccessHandler(restore).getSavedSettings();
</script>
</body>
</html>
