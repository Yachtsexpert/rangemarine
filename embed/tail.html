</div>

<script>
/* Фон героя: изобаты морской карты с промерами глубин. */
(function () {
  if (window.__rmChartInit) return;
  window.__rmChartInit = true;

  function start() {
    var cvs = document.getElementById("rm-chart");
    if (!cvs || !cvs.getContext) return;
    var ctx = cvs.getContext("2d");

    function draw() {
      var host = cvs.parentElement;
      var w = host.clientWidth, h = host.clientHeight;
      if (!w || !h) return;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      cvs.width = w * dpr;
      cvs.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);

      var stroke = getComputedStyle(cvs).getPropertyValue("--rm-contour").trim() || "rgba(11,26,33,.14)";
      ctx.strokeStyle = stroke;
      ctx.fillStyle = stroke;
      ctx.lineWidth = 1;

      var levels = 11;
      for (var i = 0; i < levels; i++) {
        var t = i / (levels - 1);
        var base = h * (0.16 + t * 0.98);
        var amp = 16 + i * 5;
        ctx.beginPath();
        for (var x = -20; x <= w + 20; x += 6) {
          var p = x / w;
          var y = base
            + amp * Math.sin(p * 3.1 + i * 0.55)
            + amp * 0.45 * Math.sin(p * 7.4 + i * 1.3)
            + amp * 0.2 * Math.sin(p * 13.1 + i * 0.9);
          if (x === -20) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.globalAlpha = 1 - t * 0.45;
        ctx.stroke();
      }

      ctx.globalAlpha = 0.75;
      ctx.font = '10px "IBM Plex Mono", monospace';
      var soundings = [[0.08, 0.30, "4,2"], [0.26, 0.52, "7,8"], [0.44, 0.24, "3,1"],
                       [0.62, 0.63, "11,4"], [0.79, 0.38, "6,5"], [0.91, 0.71, "14,0"],
                       [0.17, 0.78, "9,3"], [0.53, 0.86, "12,7"]];
      for (var s = 0; s < soundings.length; s++) {
        ctx.fillText(soundings[s][2], soundings[s][0] * w, soundings[s][1] * h);
      }
      ctx.globalAlpha = 1;
    }

    var raf;
    function schedule() { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); }

    draw();
    window.addEventListener("resize", schedule);
    if (window.ResizeObserver) new ResizeObserver(schedule).observe(cvs.parentElement);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(schedule);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }
})();
</script>
